# Production overrides: docker compose -f docker-compose.yml -f deployment/production/docker-compose.prod.yml up -d
services:
  postgres:
    deploy:
      resources: { limits: { cpus: "6", memory: 24g } }
    stop_grace_period: 2m
  api:
    deploy:
      replicas: 4
      resources: { limits: { cpus: "2", memory: 1g } }
    environment:
      RATE_LIMIT_PER_MINUTE: "1200"
  worker:
    deploy:
      replicas: 2   # leases guarantee each job runs on one replica at a time
      resources: { limits: { cpus: "1", memory: 768m } }
  ai-engine:
    deploy:
      resources: { limits: { cpus: "2", memory: 2g } }
  web:
    deploy:
      resources: { limits: { cpus: "1", memory: 256m } }
