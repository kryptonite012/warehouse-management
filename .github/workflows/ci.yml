name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: quickstore_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quickstore_test?schema=public
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quickstore_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npx tsc --noEmit -p apps/api/tsconfig.json
      - run: npm test
      - run: npm run build

  ai-engine:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/ai-engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  edge-agent:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/edge-agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go vet ./... && go test ./...

  images:
    runs-on: ubuntu-latest
    needs: [api, ai-engine, edge-agent]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q
      - run: docker build -f infrastructure/docker/api.Dockerfile -t quickstore/api:ci .
      - run: docker build -f infrastructure/docker/web.Dockerfile -t quickstore/web:ci .
      - run: docker build -t quickstore/ai-engine:ci apps/ai-engine
      - run: docker build -t quickstore/edge-agent:ci apps/edge-agent
