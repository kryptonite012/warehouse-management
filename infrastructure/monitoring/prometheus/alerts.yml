groups:
  - name: quickstore-availability
    rules:
      - alert: ApiDown
        expr: up{job="quickstore-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "API instance {{ $labels.instance }} is down" }
      - alert: ApiHighErrorRate
        expr: sum(rate(quickstore_http_request_duration_seconds_count{status=~"5.."}[5m])) / sum(rate(quickstore_http_request_duration_seconds_count[5m])) > 0.02
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "More than 2% of API requests are failing" }
      - alert: ApiLatencySLOBurn
        # SLO: 99% of requests under 500 ms.
        expr: histogram_quantile(0.99, sum(rate(quickstore_http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "p99 API latency above 500 ms" }
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "PostgreSQL is not reachable" }
      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "PostgreSQL connections above 80% of max" }
  - name: quickstore-business
    rules:
      - alert: ReservationFailuresSpike
        expr: increase(quickstore_business_events_total{event="reservation_failed"}[15m]) > 50
        labels: { severity: warning }
        annotations: { summary: "Many checkouts failing on stock — check replenishment" }
      - alert: NoOrdersPlaced
        expr: increase(quickstore_business_events_total{event="order_placed"}[30m]) == 0 and on() hour() >= 1 and on() hour() <= 17
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "No orders placed in 30 minutes during trading hours (UTC 01–17)" }
