listen_addresses = '*'
max_connections = 300
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB
wal_level = replica
max_wal_senders = 10
wal_keep_size = 1GB
# Continuous WAL archiving for point-in-time recovery (see documentation/deployment/backup-and-recovery.md)
archive_mode = on
archive_command = 'test ! -f /wal-archive/%f && cp %p /wal-archive/%f'
archive_timeout = 300
checkpoint_timeout = 10min
max_wal_size = 4GB
log_min_duration_statement = 500
log_lock_waits = on
log_checkpoints = on
shared_preload_libraries = 'pg_stat_statements'
password_encryption = scram-sha-256
timezone = 'UTC'
