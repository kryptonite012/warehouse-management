# QuickStore — complete on-premises stack.
#   cp .env.example .env && ./scripts/generate-dev-certs.sh && docker compose up -d
# Networks: edge (reverse proxy only) → app (services) → data (stores; internal, never published).

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5", tag: "{{.Name}}" }

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://quickstore_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=20
  MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  CORS_ORIGINS: https://${ADMIN_HOST},https://${SHOP_HOST}
  STOREFRONT_ORG_CODE: ${SEED_ORG_CODE:-QS}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  AI_ENGINE_URL: http://ai-engine:8000
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
  COD_ENABLED: ${COD_ENABLED:-true}
  RESERVATION_TTL_MINUTES: ${RESERVATION_TTL_MINUTES:-15}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgwal:/wal-archive
      - ./infrastructure/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    shm_size: 256m
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      retries: 10
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }
    networks: [data]
    logging: *logging

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [data]
    logging: *logging

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      retries: 10
    networks: [data]
    logging: *logging

  migrate:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    image: quickstore/api:${QS_VERSION:-latest}
    command: ["migrate"]
    environment: *app-env
    depends_on: { postgres: { condition: service_healthy } }
    networks: [data]
    restart: "no"
    logging: *logging

  grants:
    image: postgres:16-alpine
    entrypoint: ["sh", "/scripts/post-migrate-grants.sh"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes: [./scripts/post-migrate-grants.sh:/scripts/post-migrate-grants.sh:ro]
    depends_on: { migrate: { condition: service_completed_successfully } }
    networks: [data]
    restart: "no"

  api:
    image: quickstore/api:${QS_VERSION:-latest}
    command: ["api"]
    restart: unless-stopped
    environment: *app-env
    depends_on:
      grants: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [app, data]
    deploy:
      replicas: ${API_REPLICAS:-2}
    logging: *logging

  worker:
    image: quickstore/api:${QS_VERSION:-latest}
    command: ["worker"]
    restart: unless-stopped
    environment: *app-env
    depends_on:
      grants: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck: { disable: true }
    networks: [app, data]
    logging: *logging

  ai-engine:
    build: { context: apps/ai-engine }
    image: quickstore/ai-engine:${QS_VERSION:-latest}
    restart: unless-stopped
    networks: [app]
    logging: *logging

  web:
    build: { context: ., dockerfile: infrastructure/docker/web.Dockerfile }
    image: quickstore/web:${QS_VERSION:-latest}
    restart: unless-stopped
    environment:
      ADMIN_HOST: ${ADMIN_HOST}
      SHOP_HOST: ${SHOP_HOST}
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes: [./infrastructure/nginx/certs:/etc/nginx/certs:ro]
    depends_on: [api]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
    networks: [edge, app]
    logging: *logging

  # ------------------------------------------------------------ observability
  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./infrastructure/monitoring/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    networks: [app, data, monitoring]
    profiles: [monitoring]
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes: [./infrastructure/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro]
    networks: [monitoring]
    profiles: [monitoring]
    logging: *logging

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    networks: [data]
    profiles: [monitoring]
    logging: *logging

  loki:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./infrastructure/monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - lokidata:/loki
    networks: [monitoring]
    profiles: [monitoring]
    logging: *logging

  promtail:
    image: grafana/promtail:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./infrastructure/monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [monitoring]
    profiles: [monitoring]
    logging: *logging

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    networks: [monitoring]
    profiles: [monitoring]
    logging: *logging

networks:
  edge: {}
  app: { internal: true }
  data: { internal: true }
  monitoring: { internal: false }

volumes:
  pgdata: {}
  pgwal: {}
  redisdata: {}
  rabbitdata: {}
  miniodata: {}
  promdata: {}
  lokidata: {}
  grafanadata: {}
